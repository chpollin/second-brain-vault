<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain Vault explorer</title>
<link rel="stylesheet" href="demo/style.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="demo/shell.css">
<script type="module" src="app.js"></script>
</head>
<body data-shell-public="true" data-shell-base="demo/" data-shell-template="./" data-shell-page="template">
<header class="kopf shell-kopf" lang="de"></header>
<main class="template-main">
<div class="template-tools">
  <h2>Vorlage</h2>
  <div class="find" role="search">
    <label for="q">Search names, headings and text</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false">
  </div>
  <nav class="repo" aria-label="Vorlage herunterladen">
    <a href="https://github.com/chpollin/second-brain-vault/archive/refs/heads/main.zip">Download ZIP</a>
  </nav>
</div>

<div class="tasking">
  <p class="pick">
    <label for="task">Prescribed reading path</label>
    <select id="task"><option value="">no task</option></select>
  </p>
  <p class="stepper" id="stepper" hidden>
    <button type="button" id="prev">Previous step</button>
    <span id="step-of" aria-live="polite"></span>
    <button type="button" id="next">Next step</button>
  </p>
</div>

<div class="stage" id="stage" data-view="map">
  <section id="map" aria-label="Loading map"></section>

  <article id="reader" hidden>
    <h2 id="doc-title" tabindex="-1"></h2>
    <p id="doc-lead" class="lead" hidden></p>
    <dl id="doc-fields" class="frontmatter" hidden></dl>
    <nav id="doc-outline" class="outline" hidden aria-label="Sections of this document"></nav>
    <div id="doc-body" class="prose"></div>
    <div class="relations">
      <section id="doc-inbound" class="relation"></section>
      <section id="doc-linksto" class="relation"></section>
    </div>
  </article>

  <section id="results" hidden tabindex="-1" aria-labelledby="results-head">
    <h2 id="results-head"></h2>
    <div id="results-groups"></div>
  </section>
</div>

</main>
<script src="demo/shell.js"></script>
</body>
</html>
