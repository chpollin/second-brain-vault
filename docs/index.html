<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain Vault</title>
<meta name="description" content="A folder of linked text notes in which earlier thinking stays findable with its reasons, kept together with an AI assistant. What it is, how to build one, and how it is used.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="stylesheet" href="site.css">
<script type="module" src="page.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-head night" id="site-head"></header>
<main id="main">

<section id="top" class="night night-glass">
  <div class="hero">
    <div class="hero-text" id="hero-text"></div>
    <figure class="hero-graph">
      <div class="graph" id="hero-graph"></div>
      <figcaption>
        <p class="graph-legend" id="hero-legend"></p>
        <p class="graph-hint" id="hero-hint"></p>
      </figcaption>
    </figure>
  </div>
</section>

<section id="understand" class="band"><div class="inner" id="understand-body"></div></section>

<section id="build" class="band alt">
  <div class="grow">
    <div id="build-steps"></div>
    <div class="grow-graph night">
      <div class="graph" id="grow-graph"></div>
      <p class="grow-caption" id="grow-caption" aria-live="polite"></p>
    </div>
  </div>
</section>

<section id="episode" class="band night night-glass">
  <div class="inner">
    <h2 id="episode-title"></h2>
    <p class="intro" id="episode-intro"></p>
    <div class="grow">
      <div id="episode-stepper"></div>
      <div class="graph" id="episode-graph"></div>
    </div>
  </div>
</section>

<section id="data" class="band"><div class="inner" id="data-body"></div></section>
<section id="maintain" class="band alt"><div class="inner" id="maintain-body"></div></section>
<section id="reference" class="band"><div class="inner" id="reference-body"></div></section>

</main>
<footer class="site-foot night" id="site-foot"></footer>
<div class="node-card" id="node-card" hidden></div>
<aside class="panel" id="panel" aria-labelledby="panel-title" hidden>
  <div class="panel-head">
    <h2 id="panel-title" tabindex="-1"></h2>
    <button type="button" id="panel-close"></button>
  </div>
  <p class="panel-path" id="panel-path"></p>
  <div id="panel-body"></div>
</aside>
<noscript><p>This page needs JavaScript. The template itself is on <a href="https://github.com/chpollin/second-brain-vault">GitHub</a>.</p></noscript>
</body>
</html>
